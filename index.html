<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>手机壳订货系统</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --ink:#1c1a17;
    --paper:#faf7f2;
    --card:#ffffff;
    --line:#e4ddd2;
    --accent:#b3542c;
    --accent-soft:#f2e2d5;
    --good:#3f6b4f;
    --mono: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    background:var(--paper);
    color:var(--ink);
  }
  header{
    padding:20px 20px 0;
    border-bottom:1px solid var(--line);
    position:sticky;
    top:0;
    background:var(--paper);
    z-index:20;
  }
  header h1{
    margin:0 0 2px;
    font-size:19px;
    letter-spacing:-0.01em;
  }
  header p.sub{
    margin:0 0 12px;
    color:#8a8175;
    font-size:12px;
  }

  /* Model selector tabs */
  .model-tabs-row{
    display:flex;
    align-items:center;
    gap:8px;
  }
  .model-tabs{
    display:flex;
    gap:6px;
    overflow-x:auto;
    padding-bottom:10px;
    flex:1;
    scrollbar-width:none;
  }
  .model-tabs::-webkit-scrollbar{display:none;}
  .model-tab{
    flex-shrink:0;
    padding:8px 14px;
    border-radius:999px;
    border:1px solid var(--line);
    background:var(--card);
    font-size:13px;
    font-weight:600;
    cursor:pointer;
    white-space:nowrap;
    position:relative;
  }
  .model-tab.active{
    background:var(--ink);
    color:#fff;
    border-color:var(--ink);
  }
  .model-tab .tab-count{
    display:inline-block;
    margin-left:5px;
    font-size:10.5px;
    background:var(--accent);
    color:#fff;
    padding:1px 6px;
    border-radius:999px;
    font-family:var(--mono);
  }
  .model-tab.active .tab-count{background:rgba(255,255,255,0.25);}
  .manage-models-btn{
    flex-shrink:0;
    padding:8px 12px;
    border-radius:999px;
    border:1px dashed #b0a897;
    background:transparent;
    font-size:12.5px;
    color:#8a8175;
    cursor:pointer;
    white-space:nowrap;
    margin-bottom:10px;
  }

  .toolbar{
    display:flex;
    gap:8px;
    padding:0 0 14px;
    flex-wrap:wrap;
    align-items:center;
  }
  .search{
    flex:1;
    min-width:120px;
    padding:9px 12px;
    border:1px solid var(--line);
    border-radius:8px;
    font-size:14px;
    background:var(--card);
  }
  .cart-btn{
    position:relative;
    background:var(--ink);
    color:#fff;
    border:none;
    padding:9px 16px;
    border-radius:8px;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    white-space:nowrap;
  }
  .cart-badge{
    position:absolute;
    top:-6px;
    right:-6px;
    background:var(--accent);
    color:#fff;
    font-size:11px;
    min-width:18px;
    height:18px;
    border-radius:9px;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:0 4px;
    font-weight:700;
  }

  .no-model-banner{
    margin:0 20px 16px;
    padding:14px 16px;
    background:var(--accent-soft);
    border-radius:10px;
    font-size:13px;
    color:#7a4423;
  }
  .no-model-banner button{
    margin-top:8px;
    background:var(--ink);
    color:#fff;
    border:none;
    padding:8px 14px;
    border-radius:7px;
    font-size:12.5px;
    font-weight:700;
    cursor:pointer;
  }

  main{
    padding:0 16px 100px;
  }
  .current-model-label{
    font-size:12px;
    color:#8a8175;
    padding:2px 4px 12px;
  }
  .current-model-label b{color:var(--ink);}
  .grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:8px;
  }
  @media (min-width:480px){
    .grid{grid-template-columns:repeat(3,1fr);}
  }
  @media (min-width:680px){
    .grid{grid-template-columns:repeat(4,1fr);}
  }
  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:11px;
    overflow:hidden;
  }
  .card-img-wrap{
    aspect-ratio:1/0.8;
    background:#f1ece3;
    overflow:hidden;
    position:relative;
  }
  .card-img-wrap img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }
  .img-dots{
    position:absolute;
    bottom:6px;
    left:50%;
    transform:translateX(-50%);
    display:flex;
    gap:4px;
  }
  .img-dots span{
    width:5px;
    height:5px;
    border-radius:50%;
    background:rgba(255,255,255,0.5);
  }
  .img-dots span.active{background:#fff;}
  .img-nav-btn{
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    background:rgba(28,26,23,0.5);
    color:#fff;
    border:none;
    width:22px;
    height:22px;
    border-radius:50%;
    cursor:pointer;
    font-size:12px;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .img-nav-btn.prev{left:5px;}
  .img-nav-btn.next{right:5px;}
  .edit-imgs-btn{
    position:absolute;
    top:5px;
    right:5px;
    background:rgba(255,255,255,0.92);
    border:none;
    font-size:9.5px;
    padding:3px 6px;
    border-radius:5px;
    cursor:pointer;
    font-weight:600;
  }
  .code-banner{
    background:var(--ink);
    color:#fff;
    padding:5px 8px 4px;
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:4px;
  }
  .code-banner .code-big{
    font-family:var(--mono);
    font-size:19px;
    font-weight:800;
    letter-spacing:-0.01em;
    line-height:1.1;
  }
  .card-body{
    padding:8px 9px 10px;
  }
  .card-name{
    font-size:11px;
    font-weight:500;
    margin:0 0 7px;
    line-height:1.3;
    color:#5c564c;
    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
    overflow:hidden;
  }
  .color-qty-list{
    display:flex;
    flex-direction:column;
    gap:5px;
  }
  .color-qty-row{
    display:flex;
    align-items:center;
    gap:5px;
  }
  .color-name{
    font-size:11.5px;
    flex:1;
    min-width:0;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .qty-stepper{
    display:flex;
    align-items:center;
    gap:0;
    border:1px solid var(--line);
    border-radius:6px;
    overflow:hidden;
    flex-shrink:0;
  }
  .qty-stepper button{
    width:20px;
    height:22px;
    border:none;
    background:var(--paper);
    font-size:12px;
    cursor:pointer;
    color:var(--ink);
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .qty-stepper input{
    width:26px;
    text-align:center;
    border:none;
    border-left:1px solid var(--line);
    border-right:1px solid var(--line);
    font-size:11.5px;
    padding:4px 0;
    -moz-appearance:textfield;
  }
  .qty-stepper input.has-qty{
    background:var(--accent-soft);
    font-weight:700;
  }
  .qty-stepper input::-webkit-outer-spin-button,
  .qty-stepper input::-webkit-inner-spin-button{
    -webkit-appearance:none;
    margin:0;
  }

  .overlay{
    position:fixed;
    inset:0;
    background:rgba(28,26,23,0.4);
    z-index:50;
    display:none;
  }
  .overlay.open{display:block;}
  .panel{
    position:fixed;
    right:0;
    top:0;
    bottom:0;
    width:100%;
    max-width:440px;
    background:var(--paper);
    z-index:60;
    transform:translateX(100%);
    transition:transform .25s ease;
    display:flex;
    flex-direction:column;
  }
  .panel.open{transform:translateX(0);}
  .panel-header{
    padding:18px 18px 12px;
    border-bottom:1px solid var(--line);
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .panel-header h2{
    margin:0;
    font-size:17px;
  }
  .close-btn{
    background:none;
    border:none;
    font-size:20px;
    cursor:pointer;
    color:#8a8175;
    line-height:1;
  }
  .panel-body{
    flex:1;
    overflow-y:auto;
    padding:12px 18px;
  }

  .model-group-header{
    font-size:12.5px;
    font-weight:700;
    color:var(--accent);
    margin:16px 0 4px;
    padding-bottom:4px;
    border-bottom:1px solid var(--line);
    text-transform:uppercase;
    letter-spacing:0.03em;
  }
  .model-group-header:first-child{margin-top:0;}

  .cart-item{
    display:flex;
    gap:10px;
    padding:10px 0;
    border-bottom:1px solid var(--line);
    align-items:center;
  }
  .cart-item img{
    width:52px;
    height:52px;
    object-fit:cover;
    border-radius:8px;
    flex-shrink:0;
    background:#eee;
  }
  .cart-item-info{flex:1; min-width:0;}
  .cart-item-info .name{
    font-size:13px;
    font-weight:600;
    margin:0 0 2px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .cart-item-info .meta{
    font-size:11.5px;
    color:#8a8175;
    font-family:var(--mono);
    display:block;
    line-height:1.5;
  }
  .cart-item-qty{
    font-size:13px;
    font-weight:700;
    font-family:var(--mono);
    color:var(--accent);
    flex-shrink:0;
  }
  .cart-item.merged{
    align-items:flex-start;
  }
  .cart-item.merged img{
    margin-top:2px;
  }
  .color-qty-tags{
    display:flex;
    flex-wrap:wrap;
    gap:5px;
    margin-top:4px;
  }
  .color-qty-tag{
    display:inline-flex;
    align-items:center;
    gap:4px;
    background:var(--accent-soft);
    color:#7a4423;
    font-size:11.5px;
    padding:3px 4px 3px 8px;
    border-radius:999px;
  }
  .color-qty-tag b{
    font-family:var(--mono);
    font-weight:700;
  }
  .tag-remove{
    background:none;
    border:none;
    color:#7a4423;
    font-size:10px;
    cursor:pointer;
    padding:2px 4px;
    opacity:0.6;
  }
  .remove-btn{
    background:none;
    border:none;
    color:#b3542c;
    font-size:12px;
    cursor:pointer;
    padding:4px;
    flex-shrink:0;
  }
  .panel-footer{
    padding:14px 18px 18px;
    border-top:1px solid var(--line);
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .totals{
    display:flex;
    justify-content:space-between;
    font-size:14px;
    font-weight:700;
  }
  .export-row{
    display:flex;
    gap:8px;
  }
  .export-btn{
    flex:1;
    padding:11px;
    border-radius:9px;
    border:1px solid var(--ink);
    background:var(--ink);
    color:#fff;
    font-size:13px;
    font-weight:700;
    cursor:pointer;
  }
  .export-btn.secondary{
    background:var(--card);
    color:var(--ink);
  }
  .empty-state{
    text-align:center;
    color:#8a8175;
    padding:40px 20px;
    font-size:13px;
  }
  .clear-link{
    text-align:center;
    font-size:12px;
    color:#8a8175;
    text-decoration:underline;
    cursor:pointer;
    background:none;
    border:none;
  }

  .model-manage-row{
    display:flex;
    align-items:center;
    gap:8px;
    padding:9px 0;
    border-bottom:1px solid var(--line);
  }
  .model-manage-row span{
    flex:1;
    font-size:13.5px;
  }
  .model-manage-row input.edit-input{
    flex:1;
    padding:6px 8px;
    border:1px solid var(--accent);
    border-radius:6px;
    font-size:13.5px;
  }
  .icon-sm-btn{
    background:none;
    border:none;
    cursor:pointer;
    font-size:14px;
    padding:4px 6px;
    color:#8a8175;
  }
  .icon-sm-btn.danger{color:#b3542c;}
  .add-new-model{
    display:flex;
    gap:8px;
    padding-top:12px;
  }
  .add-new-model input{
    flex:1;
    padding:9px 10px;
    border:1px solid var(--line);
    border-radius:8px;
    font-size:14px;
  }
  .add-new-model button{
    padding:9px 14px;
    border:none;
    background:var(--good);
    color:#fff;
    border-radius:8px;
    font-size:13px;
    font-weight:700;
    cursor:pointer;
  }

  .img-manage-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
    margin-top:10px;
  }
  .img-manage-cell{
    position:relative;
    aspect-ratio:1;
    border-radius:8px;
    overflow:hidden;
    border:1px solid var(--line);
    cursor:grab;
  }
  .img-manage-cell.dragging{opacity:0.4;}
  .img-manage-cell.drag-over{outline:2px solid var(--accent);}
  .img-manage-cell img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
    pointer-events:none;
  }
  .img-manage-cell .del-img-btn{
    position:absolute;
    top:3px;
    right:3px;
    background:rgba(28,26,23,0.75);
    color:#fff;
    border:none;
    width:20px;
    height:20px;
    border-radius:50%;
    font-size:12px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .img-manage-cell .order-num{
    position:absolute;
    bottom:3px;
    left:3px;
    background:rgba(28,26,23,0.75);
    color:#fff;
    font-size:10px;
    padding:1px 5px;
    border-radius:4px;
    font-family:var(--mono);
  }
  .add-img-cell{
    aspect-ratio:1;
    border-radius:8px;
    border:1.5px dashed var(--line);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    color:#8a8175;
    font-size:22px;
    background:var(--paper);
  }
  .hint-text{
    font-size:11.5px;
    color:#8a8175;
    margin-top:8px;
    line-height:1.5;
  }
  #fileInput{display:none;}
</style>
</head>
<body>

<header>
  <h1>手机壳订货系统</h1>
  <p class="sub">先选机型，再为该机型下的每款商品选颜色和数量</p>
  <div class="model-tabs-row">
    <div class="model-tabs" id="modelTabs"></div>
  </div>
  <button class="manage-models-btn" onclick="openModelManager()">+ 机型管理</button>
  <div class="toolbar">
    <input class="search" id="searchInput" placeholder="搜索款式名称或编码…" oninput="renderGrid()">
    <button class="cart-btn" onclick="openCart()">
      订货清单
      <span class="cart-badge" id="cartBadge">0</span>
    </button>
  </div>
</header>

<div id="noModelBanner" class="no-model-banner" style="display:none;">
  还没有添加任何机型。请先添加一个机型（如 iPhone 16 Pro Max），再开始为该机型选购款式和颜色。
  <br>
  <button onclick="openModelManager()">添加机型</button>
</div>

<main>
  <p class="current-model-label" id="currentModelLabel"></p>
  <div class="grid" id="productGrid"></div>
</main>

<div class="overlay" id="overlay" onclick="closeAllPanels()"></div>
<div class="panel" id="cartPanel">
  <div class="panel-header">
    <h2>订货清单</h2>
    <button class="close-btn" onclick="closeAllPanels()">✕</button>
  </div>
  <div class="panel-body" id="cartItems"></div>
  <div class="panel-footer">
    <div class="totals">
      <span>合计件数</span>
      <span id="totalQty">0</span>
    </div>
    <div class="export-row">
      <button class="export-btn" onclick="exportExcel()">导出 Excel</button>
      <button class="export-btn secondary" onclick="exportImage()">导出图片</button>
    </div>
    <button class="clear-link" onclick="clearCart()">清空清单</button>
  </div>
</div>

<div class="panel" id="modelPanel">
  <div class="panel-header">
    <h2>机型管理</h2>
    <button class="close-btn" onclick="closeAllPanels()">✕</button>
  </div>
  <div class="panel-body">
    <p class="hint-text">添加机型后，顶部会出现对应的标签页。切换标签页即可分别为不同机型选购，数量互不影响。</p>
    <div id="modelManageList"></div>
    <div class="add-new-model">
      <input id="newModelInput" placeholder="输入新机型，如 iPhone 16 Pro Max" onkeydown="if(event.key==='Enter')addGlobalModel()">
      <button onclick="addGlobalModel()">添加</button>
    </div>
  </div>
</div>

<div class="panel" id="imgPanel">
  <div class="panel-header">
    <h2>管理图片</h2>
    <button class="close-btn" onclick="closeAllPanels()">✕</button>
  </div>
  <div class="panel-body">
    <p class="hint-text" id="imgPanelProductName"></p>
    <div class="img-manage-grid" id="imgManageGrid"></div>
    <p class="hint-text">拖动图片可调整显示顺序，第一张为封面图。点击右上角 ✕ 删除图片。点击虚线框上传新图片。</p>
  </div>
</div>
<input type="file" id="fileInput" accept="image/*" multiple>

<script>
// Storage shim: on GitHub Pages there is no window.storage, so save to the browser's localStorage
if(!window.storage){
  window.storage = {
    async get(key){ const v = localStorage.getItem(key); return v === null ? null : { key, value: v }; },
    async set(key, value){ localStorage.setItem(key, value); return { key, value }; },
    async delete(key){ localStorage.removeItem(key); return { key, deleted: true }; }
  };
}

    const m = code.match(/^([A-Za-z]*)(\d+)/);
    if(m) return [m[1], parseInt(m[2]), code];
    return [code, -1, code];
  };
  const pa = parse(a.code), pb = parse(b.code);
  if(pa[0] !== pb[0]) return pa[0] < pb[0] ? -1 : 1;
  if(pa[1] !== pb[1]) return pa[1] - pb[1];
  return pa[2].localeCompare(pb[2]);
}

async function init(){
  let savedProducts = null;
  try{
    const res = await window.storage.get('products-v4');
    if(res && res.value) savedProducts = JSON.parse(res.value);
  }catch(e){}

  if(savedProducts){
    PRODUCTS = savedProducts;
  } else {
    PRODUCTS = SEED_PRODUCTS.map(p => ({
      id: p.id, name: p.name, code: p.code, colors: p.colors,
      images: p.images ? p.images : [p.image]
    }));
    PRODUCTS.sort(naturalCodeSort);
    await saveProducts();
  }

  try{
    const res = await window.storage.get('global-models-v3');
    if(res && res.value) GLOBAL_MODELS = JSON.parse(res.value);
  }catch(e){ GLOBAL_MODELS = []; }

  try{
    const res = await window.storage.get('cart-v3');
    if(res && res.value) cart = JSON.parse(res.value);
  }catch(e){ cart = {}; }

  if(GLOBAL_MODELS.length > 0) currentModel = GLOBAL_MODELS[0];

  renderModelTabs();
  renderGrid();
  renderCart();
  renderModelManager();
}

async function saveProducts(){
  try{ await window.storage.set('products-v4', JSON.stringify(PRODUCTS)); }
  catch(e){ console.error(e); }
}
async function saveModels(){
  try{ await window.storage.set('global-models-v3', JSON.stringify(GLOBAL_MODELS)); }
  catch(e){ console.error(e); }
}
async function saveCart(){
  try{ await window.storage.set('cart-v3', JSON.stringify(cart)); }
  catch(e){ console.error(e); }
}

function modelItemCount(model){
  if(!cart[model]) return 0;
  let n = 0;
  Object.values(cart[model]).forEach(colorMap => {
    Object.values(colorMap).forEach(qty => { if(qty > 0) n++; });
  });
  return n;
}

function renderModelTabs(){
  const container = document.getElementById('modelTabs');
  const banner = document.getElementById('noModelBanner');

  if(GLOBAL_MODELS.length === 0){
    container.innerHTML = '';
    banner.style.display = 'block';
    document.getElementById('currentModelLabel').textContent = '';
    return;
  }
  banner.style.display = 'none';

  if(!currentModel || !GLOBAL_MODELS.includes(currentModel)){
    currentModel = GLOBAL_MODELS[0];
  }

  container.innerHTML = GLOBAL_MODELS.map(m => {
    const active = m === currentModel ? 'active' : '';
    const count = modelItemCount(m);
    const countHtml = count > 0 ? `<span class="tab-count">${count}</span>` : '';
    return `<button class="model-tab ${active}" onclick="switchModel('${m.replace(/'/g,"\\'")}')">${m}${countHtml}</button>`;
  }).join('');

  document.getElementById('currentModelLabel').innerHTML = `当前正在为 <b>${currentModel}</b> 选购`;
}

function switchModel(m){
  currentModel = m;
  renderModelTabs();
  renderGrid();
}

function renderGrid(){
  const grid = document.getElementById('productGrid');
  if(!currentModel){
    grid.innerHTML = '';
    return;
  }

  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  grid.innerHTML = '';
  const filtered = PRODUCTS.filter(p =>
    p.name.toLowerCase().includes(q) || p.code.toLowerCase().includes(q)
  );

  const modelCart = cart[currentModel] || {};

  filtered.forEach(p => {
    const card = document.createElement('div');
    card.className = 'card';

    const imgIdx = activeImgIndex[p.id] || 0;
    const images = p.images && p.images.length ? p.images : [''];
    const safeIdx = Math.min(imgIdx, images.length - 1);

    const dots = images.length > 1 ? `<div class="img-dots">${images.map((_,i)=>`<span class="${i===safeIdx?'active':''}"></span>`).join('')}</div>` : '';
    const navBtns = images.length > 1 ? `
      <button class="img-nav-btn prev" onclick="cycleImg('${p.id}', -1, event)">‹</button>
      <button class="img-nav-btn next" onclick="cycleImg('${p.id}', 1, event)">›</button>
    ` : '';

    const pCart = modelCart[p.id] || {};

    const colorRows = p.colors.map(c => {
      const qty = pCart[c] || 0;
      const hasQty = qty > 0 ? 'has-qty' : '';
      return `<div class="color-qty-row">
        <span class="color-name">${c}</span>
        <div class="qty-stepper">
          <button onclick="stepQty('${p.id}','${c.replace(/'/g,"\\'")}',-1)">−</button>
          <input type="number" min="0" value="${qty}" class="${hasQty}"
                 data-pid="${p.id}" data-color="${c}"
                 onchange="setQty('${p.id}','${c.replace(/'/g,"\\'")}', this.value)">
          <button onclick="stepQty('${p.id}','${c.replace(/'/g,"\\'")}',1)">+</button>
        </div>
      </div>`;
    }).join('');

    card.innerHTML = `
      <div class="card-img-wrap">
        <img src="${images[safeIdx]}" loading="lazy" alt="${p.name}">
        <button class="edit-imgs-btn" onclick="openImgManager('${p.id}')">图片</button>
        ${navBtns}
        ${dots}
      </div>
      <div class="code-banner">
        <span class="code-big">${p.code}</span>
      </div>
      <div class="card-body">
        <p class="card-name">${p.name}</p>
        <div class="color-qty-list">${colorRows}</div>
      </div>
    `;
    grid.appendChild(card);
  });
}

function cycleImg(pid, dir, evt){
  evt.stopPropagation();
  const p = PRODUCTS.find(x=>x.id===pid);
  if(!p || !p.images) return;
  const len = p.images.length;
  let idx = (activeImgIndex[pid] || 0) + dir;
  if(idx < 0) idx = len - 1;
  if(idx >= len) idx = 0;
  activeImgIndex[pid] = idx;
  renderGrid();
}

function ensureCartPath(model, pid){
  if(!cart[model]) cart[model] = {};
  if(!cart[model][pid]) cart[model][pid] = {};
}

function stepQty(pid, color, delta){
  ensureCartPath(currentModel, pid);
  const cur = cart[currentModel][pid][color] || 0;
  let next = cur + delta;
  if(next < 0) next = 0;
  cart[currentModel][pid][color] = next;
  saveCart();
  renderGrid();
  renderCart();
  renderModelTabs();
}

function setQty(pid, color, value){
  let val = parseInt(value);
  if(isNaN(val) || val < 0) val = 0;
  ensureCartPath(currentModel, pid);
  cart[currentModel][pid][color] = val;
  saveCart();
  renderGrid();
  renderCart();
  renderModelTabs();
}

function renderCart(){
  const container = document.getElementById('cartItems');
  const badge = document.getElementById('cartBadge');
  const totalQtyEl = document.getElementById('totalQty');

  let totalProducts = 0; // count of merged product lines (for badge)
  let totalQty = 0;
  let html = '';

  GLOBAL_MODELS.forEach(model => {
    const modelCart = cart[model];
    if(!modelCart) return;

    // Build merged rows: one row per product, with list of {color, qty}
    const productRows = [];
    Object.keys(modelCart).forEach(pid => {
      const p = PRODUCTS.find(x=>x.id===pid);
      if(!p) return;
      const colorEntries = Object.entries(modelCart[pid]).filter(([c,q]) => q > 0);
      if(colorEntries.length === 0) return;
      productRows.push({
        pid, name:p.name, code:p.code,
        image:(p.images&&p.images[0])||'',
        colorEntries
      });
    });
    if(productRows.length === 0) return;

    html += `<div class="model-group-header">${model}</div>`;
    productRows.forEach(item => {
      totalProducts++;
      const lineQty = item.colorEntries.reduce((s,[,q])=>s+q, 0);
      totalQty += lineQty;

      const colorTagsHtml = item.colorEntries.map(([color, qty]) => `
        <span class="color-qty-tag">
          ${color}<b>×${qty}</b>
          <button class="tag-remove" onclick="removeItem('${model.replace(/'/g,"\\'")}','${item.pid}','${color.replace(/'/g,"\\'")}')">✕</button>
        </span>
      `).join('');

      html += `<div class="cart-item merged">
        <img src="${item.image}" alt="${item.name}">
        <div class="cart-item-info">
          <p class="name">${item.code} · ${item.name}</p>
          <div class="color-qty-tags">${colorTagsHtml}</div>
        </div>
        <div class="cart-item-qty">合计 ${lineQty}</div>
      </div>`;
    });
  });

  badge.textContent = totalProducts;
  totalQtyEl.textContent = totalQty;

  if(totalProducts === 0){
    container.innerHTML = '<div class="empty-state">还没有选择任何款式<br>先选择机型，再为每个款式填写颜色数量</div>';
    return;
  }
  container.innerHTML = html;
}

function removeItem(model, pid, color){
  if(cart[model] && cart[model][pid]){
    delete cart[model][pid][color];
  }
  saveCart();
  renderGrid();
  renderCart();
  renderModelTabs();
}

function clearCart(){
  if(Object.keys(cart).length === 0) return;
  if(confirm('确定要清空整个订货清单吗？（所有机型）')){
    cart = {};
    saveCart();
    renderGrid();
    renderCart();
    renderModelTabs();
  }
}

function openCart(){
  document.getElementById('cartPanel').classList.add('open');
  document.getElementById('overlay').classList.add('open');
}
function openModelManager(){
  renderModelManager();
  document.getElementById('modelPanel').classList.add('open');
  document.getElementById('overlay').classList.add('open');
}
function closeAllPanels(){
  document.getElementById('cartPanel').classList.remove('open');
  document.getElementById('modelPanel').classList.remove('open');
  document.getElementById('imgPanel').classList.remove('open');
  document.getElementById('overlay').classList.remove('open');
  renderModelTabs();
  renderGrid();
}

function renderModelManager(){
  const list = document.getElementById('modelManageList');
  if(GLOBAL_MODELS.length === 0){
    list.innerHTML = '<p class="hint-text">还没有添加任何机型。</p>';
    return;
  }
  list.innerHTML = GLOBAL_MODELS.map((m, idx) => `
    <div class="model-manage-row" id="model-row-${idx}">
      <span id="model-text-${idx}">${m}</span>
      <button class="icon-sm-btn" onclick="startEditModel(${idx})">编辑</button>
      <button class="icon-sm-btn danger" onclick="deleteModel(${idx})">删除</button>
    </div>
  `).join('');
}

function addGlobalModel(){
  const input = document.getElementById('newModelInput');
  const val = input.value.trim();
  if(!val) return;
  if(GLOBAL_MODELS.includes(val)){ alert('该机型已存在'); return; }
  GLOBAL_MODELS.push(val);
  if(!currentModel) currentModel = val;
  saveModels();
  input.value = '';
  renderModelManager();
  renderModelTabs();
  renderGrid();
}

function startEditModel(idx){
  const row = document.getElementById('model-row-'+idx);
  const oldVal = GLOBAL_MODELS[idx];
  row.innerHTML = `
    <input class="edit-input" id="edit-input-${idx}" value="${oldVal}" onkeydown="if(event.key==='Enter')confirmEditModel(${idx})">
    <button class="icon-sm-btn" onclick="confirmEditModel(${idx})">保存</button>
    <button class="icon-sm-btn danger" onclick="renderModelManager()">取消</button>
  `;
  document.getElementById('edit-input-'+idx).focus();
}

function confirmEditModel(idx){
  const newVal = document.getElementById('edit-input-'+idx).value.trim();
  if(!newVal) return;
  const oldVal = GLOBAL_MODELS[idx];
  if(newVal !== oldVal && GLOBAL_MODELS.includes(newVal)){ alert('该机型名称已存在'); return; }
  GLOBAL_MODELS[idx] = newVal;

  if(cart[oldVal]){
    cart[newVal] = cart[oldVal];
    delete cart[oldVal];
  }
  if(currentModel === oldVal) currentModel = newVal;

  saveModels();
  saveCart();
  renderModelManager();
  renderModelTabs();
  renderGrid();
  renderCart();
}

function deleteModel(idx){
  const val = GLOBAL_MODELS[idx];
  const count = modelItemCount(val);
  const msg = count > 0
    ? `机型「${val}」下已有 ${count} 项选购记录，删除该机型会一并清除这些记录，确定继续吗？`
    : `确定删除机型「${val}」吗？`;
  if(!confirm(msg)) return;

  GLOBAL_MODELS.splice(idx,1);
  delete cart[val];
  if(currentModel === val) currentModel = GLOBAL_MODELS[0] || null;

  saveModels();
  saveCart();
  renderModelManager();
  renderModelTabs();
  renderGrid();
  renderCart();
}

function openImgManager(pid){
  currentImgEditId = pid;
  const p = PRODUCTS.find(x=>x.id===pid);
  document.getElementById('imgPanelProductName').textContent = `${p.code} · ${p.name}`;
  renderImgManager();
  document.getElementById('imgPanel').classList.add('open');
  document.getElementById('overlay').classList.add('open');
}

function renderImgManager(){
  const p = PRODUCTS.find(x=>x.id===currentImgEditId);
  const grid = document.getElementById('imgManageGrid');
  const images = p.images || [];

  grid.innerHTML = images.map((src, idx) => `
    <div class="img-manage-cell" draggable="true" data-idx="${idx}"
         ondragstart="onImgDragStart(event, ${idx})"
         ondragover="onImgDragOver(event, ${idx})"
         ondrop="onImgDrop(event, ${idx})"
         ondragend="onImgDragEnd(event)">
      <img src="${src}">
      <span class="order-num">${idx+1}</span>
      <button class="del-img-btn" onclick="deleteImg(${idx})">✕</button>
    </div>
  `).join('') + `<div class="add-img-cell" onclick="triggerFileInput()">+</div>`;
}

function triggerFileInput(){
  document.getElementById('fileInput').click();
}

document.getElementById('fileInput').addEventListener('change', function(e){
  const files = Array.from(e.target.files);
  if(!files.length) return;
  const p = PRODUCTS.find(x=>x.id===currentImgEditId);
  if(!p.images) p.images = [];

  let remaining = files.length;
  files.forEach(file => {
    const reader = new FileReader();
    reader.onload = function(ev){
      p.images.push(ev.target.result);
      remaining--;
      if(remaining === 0){
        saveProducts();
        renderImgManager();
        renderGrid();
      }
    };
    reader.readAsDataURL(file);
  });
  e.target.value = '';
});

function deleteImg(idx){
  const p = PRODUCTS.find(x=>x.id===currentImgEditId);
  if(p.images.length <= 1){ alert('至少保留一张图片'); return; }
  p.images.splice(idx,1);
  saveProducts();
  renderImgManager();
  renderGrid();
}

function onImgDragStart(evt, idx){
  dragSrcIndex = idx;
  evt.currentTarget.classList.add('dragging');
}
function onImgDragOver(evt, idx){
  evt.preventDefault();
  evt.currentTarget.classList.add('drag-over');
}
function onImgDrop(evt, idx){
  evt.preventDefault();
  const p = PRODUCTS.find(x=>x.id===currentImgEditId);
  if(dragSrcIndex === null || dragSrcIndex === idx) return;
  const imgs = p.images;
  const [moved] = imgs.splice(dragSrcIndex, 1);
  imgs.splice(idx, 0, moved);
  saveProducts();
  renderImgManager();
  renderGrid();
}
function onImgDragEnd(evt){
  document.querySelectorAll('.img-manage-cell').forEach(el => {
    el.classList.remove('dragging','drag-over');
  });
  dragSrcIndex = null;
}

function getOrderRows(){
  const rows = [];
  GLOBAL_MODELS.forEach(model => {
    const modelCart = cart[model];
    if(!modelCart) return;
    Object.keys(modelCart).forEach(pid => {
      const p = PRODUCTS.find(x=>x.id===pid);
      if(!p) return;
      Object.entries(modelCart[pid]).forEach(([color, qty]) => {
        if(qty > 0){
          rows.push({
            "机型": model,
            "编码 Code": p.code,
            "款式名称": p.name,
            "颜色": color,
            "数量": qty
          });
        }
      });
    });
  });
  return rows;
}

function exportExcel(){
  const rows = getOrderRows();
  if(rows.length === 0){ alert('清单为空，请先选择商品'); return; }
  const ws = XLSX.utils.json_to_sheet(rows);
  ws['!cols'] = [{wch:18},{wch:14},{wch:34},{wch:12},{wch:8}];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "订货单");
  const dateStr = new Date().toISOString().slice(0,10);
  XLSX.writeFile(wb, `订货单_${dateStr}.xlsx`);
}

// Merged rows: one row per model + product, colours listed as "黑 ×1、粉 ×1"
function getMergedOrderRows(){
  const rows = [];
  GLOBAL_MODELS.forEach(model => {
    const modelCart = cart[model];
    if(!modelCart) return;
    Object.keys(modelCart).forEach(pid => {
      const p = PRODUCTS.find(x=>x.id===pid);
      if(!p) return;
      const entries = Object.entries(modelCart[pid]).filter(([c,q]) => q > 0);
      if(entries.length === 0) return;
      // keep the product's own colour order
      entries.sort((a,b) => {
        const ia = p.colors.indexOf(a[0]), ib = p.colors.indexOf(b[0]);
        return (ia<0?99:ia) - (ib<0?99:ib);
      });
      rows.push({
        model: model,
        code: p.code,
        name: p.name,
        colorParts: entries.map(([c,q]) => `${c} ×${q}`),
        subtotal: entries.reduce((s,[,q]) => s+q, 0)
      });
    });
  });
  return rows;
}

// Export the order sheet as a PNG drawn with the phone's own fonts (Chinese renders correctly)
function exportImage(){
  const rows = getMergedOrderRows();
  if(rows.length === 0){ alert('清单为空，请先选择商品'); return; }

  const FONT = '-apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif';
  const W = 1240, PAD = 40, SCALE = 2;
  const cols = [
    { key:'model',    title:'Model',       w:190 },
    { key:'code',     title:'Code',        w:130 },
    { key:'name',     title:'Product Name',w:380 },
    { key:'colors',   title:'Color × Qty', w:370 },
    { key:'subtotal', title:'Qty',         w:90, align:'right' }
  ];
  const CELL_PAD = 14, LINE_H = 30, FS = 21;

  const measure = document.createElement('canvas').getContext('2d');
  measure.font = `${FS}px ${FONT}`;

  // wrap a list of tokens into lines that fit maxW
  function wrapTokens(tokens, sep, maxW){
    const lines = []; let cur = '';
    tokens.forEach(tok => {
      const tryLine = cur ? cur + sep + tok : tok;
      if(measure.measureText(tryLine).width <= maxW || !cur){ cur = tryLine; }
      else { lines.push(cur + sep.trim()); cur = tok; }
    });
    if(cur) lines.push(cur);
    return lines;
  }
  function wrapText(text, maxW){
    const words = String(text).split(' ');
    return wrapTokens(words, ' ', maxW);
  }

  // lay out every row first so we know the canvas height
  const laid = rows.map(r => {
    const cells = cols.map(c => {
      const inner = c.w - CELL_PAD*2;
      if(c.key === 'colors') return wrapTokens(r.colorParts, '、', inner);
      if(c.key === 'subtotal') return [String(r.subtotal)];
      return wrapText(r[c.key], inner);
    });
    const n = Math.max(...cells.map(l => l.length));
    return { cells, h: n*LINE_H + CELL_PAD*2 };
  });

  const HEADER_TOP = 130, HEAD_H = 56;
  const tableH = laid.reduce((s,r)=>s+r.h, 0);
  const H = HEADER_TOP + HEAD_H + tableH + 100;

  const canvas = document.createElement('canvas');
  canvas.width = W*SCALE; canvas.height = H*SCALE;
  const ctx = canvas.getContext('2d');
  ctx.scale(SCALE, SCALE);
  ctx.fillStyle = '#ffffff'; ctx.fillRect(0,0,W,H);
  ctx.textBaseline = 'middle';

  const dateStr = new Date().toISOString().slice(0,10);
  ctx.fillStyle = '#1c1a17';
  ctx.font = `bold 34px ${FONT}`;
  ctx.fillText('Phone Case Order Sheet', PAD, 58);
  ctx.font = `22px ${FONT}`;
  ctx.fillText(`Date: ${dateStr}`, PAD, 100);

  // header row
  let y = HEADER_TOP;
  ctx.fillStyle = '#1c1a17';
  ctx.fillRect(PAD, y, W-PAD*2, HEAD_H);
  ctx.fillStyle = '#ffffff';
  ctx.font = `bold ${FS}px ${FONT}`;
  let x = PAD;
  cols.forEach(c => {
    if(c.align === 'right'){ ctx.textAlign='right'; ctx.fillText(c.title, x + c.w - CELL_PAD, y + HEAD_H/2); }
    else { ctx.textAlign='left'; ctx.fillText(c.title, x + CELL_PAD, y + HEAD_H/2); }
    x += c.w;
  });
  y += HEAD_H;

  // body rows
  ctx.font = `${FS}px ${FONT}`;
  laid.forEach((r, i) => {
    if(i % 2 === 0){ ctx.fillStyle = '#f4f4f4'; ctx.fillRect(PAD, y, W-PAD*2, r.h); }
    ctx.fillStyle = '#2b2925';
    let cx = PAD;
    cols.forEach((c, ci) => {
      r.cells[ci].forEach((line, li) => {
        const ly = y + CELL_PAD + LINE_H*li + LINE_H/2;
        if(c.align === 'right'){ ctx.textAlign='right'; ctx.fillText(line, cx + c.w - CELL_PAD, ly); }
        else { ctx.textAlign='left'; ctx.fillText(line, cx + CELL_PAD, ly); }
      });
      cx += c.w;
    });
    y += r.h;
  });

  const totalQty = rows.reduce((s,r)=>s+r.subtotal, 0);
  ctx.textAlign = 'left';
  ctx.fillStyle = '#1c1a17';
  ctx.font = `bold 24px ${FONT}`;
  ctx.fillText(`Total styles: ${rows.length}    Total quantity: ${totalQty}`, PAD, y + 50);

  const fileName = `order_sheet_${dateStr}.png`;
  canvas.toBlob(async blob => {
    const file = new File([blob], fileName, { type: 'image/png' });
    // iPhone: open the share sheet (save to Photos / send via WhatsApp, WeChat)
    if(navigator.canShare && navigator.canShare({ files:[file] })){
      try { await navigator.share({ files:[file], title: 'Order Sheet' }); return; }
      catch(e){ if(e && e.name === 'AbortError') return; }
    }
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = fileName;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
  }, 'image/png');
}
